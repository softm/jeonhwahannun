<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="공식 출처로 확인하는 기관 전화번호 검색"><title>전화한눈 · 모르는 번호, 먼저 확인하세요</title><link rel="stylesheet" href="style.css"><body><header><a href="./" class="brand">☎ 전화한눈</a><nav><a href="data-status.html">데이터 현황</a><a href="https://github.com/softm/jeonhwahannun.android/actions/workflows/build-android.yml">Android 앱</a></nav></header><main><span class="eyebrow">공식 데이터 전화번호 사전</span><h1>모르는 번호,<br>어디서 온 전화일까요?</h1><p>병원부터 우체국까지. 전화번호와 기관명을 한눈에 확인하세요.</p><form id="form"><label for="query">전화번호 또는 기관명</label><div class="search"><input id="query" autocomplete="off" placeholder="02-123-4567 또는 기관명" minlength="2" required><button>검색</button></div><select id="category" aria-label="기관 종류"><option value="">전체 기관</option><option value="hospital">병원·의원</option><option value="pharmacy">약국</option><option value="post_office">우체국</option><option value="financial">금융회사</option></select></form><div id="status" role="status">검색 데이터를 준비하고 있습니다.</div><section id="results" aria-label="검색 결과"></section><button id="more" hidden>더 보기</button><aside>공개된 기관 전화번호와의 연결 정보입니다. 실제 발신자의 신원이나 안전성을 보증하지 않습니다. 미등록 번호를 스팸으로 판정하지 않습니다.</aside><footer>검색어와 연락처는 서버에 전송하지 않습니다. <a href="data-status.html">출처·수집 주기 확인</a></footer></main><script type="module" src="app.js"></script></body></html>
