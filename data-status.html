<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터 현황 · 전화한눈</title><link rel="stylesheet" href="style.css"><header><a href="./" class="brand">☎ 전화한눈</a><a href="./">번호 검색</a></header><main><h1>데이터 수집 현황</h1><div id="summary" role="status">확인 중</div><p>기준일은 원본 자료가 설명하는 시점이며 수집 시간과 다릅니다. 오래된 정보와 공유·충돌 번호는 공개 검색에서 보류합니다.</p><table><thead><tr><th>출처</th><th>세부 정보</th></tr></thead><tbody id="sources"></tbody></table><p><a href="https://github.com/softm/jeonhwahannun/actions/workflows/collect-deploy.yml">수집 실행·실패 기록 확인 ↗</a></p></main><script type="module">try{const r=await fetch('data/latest.json',{cache:'no-store'});if(!r.ok)throw Error();const m=await r.json();document.querySelector('#summary').textContent=`수집 주기: ${m.schedule} / 마지막 성공 수집: ${new Date(m.collected_at).toLocaleString('ko-KR')} / 공개 번호: ${m.count.toLocaleString()}개`;for(const s of m.sources){const tr=document.createElement('tr');for(const v of [s.provider||s.id||s.source_id,JSON.stringify(s)]){const td=document.createElement('td');td.textContent=v;tr.append(td)}document.querySelector('#sources').append(tr)}}catch{document.querySelector('#summary').textContent='수집 상태를 확인할 수 없습니다. 실행 기록을 확인해 주세요.'}</script></html>
